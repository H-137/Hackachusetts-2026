[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancestry-explorer-pipeline"
version = "0.1.0"
description = "Genomic preprocessing pipeline for the Ancestry-Aware Variant Explorer. Not a diagnostic tool."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ancestry_explorer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
